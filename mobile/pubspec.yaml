publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_svg: ^2.0.10+1
  google_sign_in: ^6.2.2
